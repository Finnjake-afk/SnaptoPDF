<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Snap to PDF</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
<style>
:root{
  color-scheme:light;
  --desk:#E9EEF3;--paper:#FFFFFF;--ink:#16202E;--muted:#5A6A7D;--line:#D3DBE4;
  --accent:#2457D6;--accent-ink:#FFFFFF;--ok:#17794F;--wash:#F3F6F9;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --desk:#0F151C;--paper:#18212B;--ink:#E7EDF4;--muted:#97A5B7;--line:#2A3644;
    --accent:#6B94FF;--accent-ink:#0B1220;--ok:#4FC38A;--wash:#1E2935;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --desk:#0F151C;--paper:#18212B;--ink:#E7EDF4;--muted:#97A5B7;--line:#2A3644;
  --accent:#6B94FF;--accent-ink:#0B1220;--ok:#4FC38A;--wash:#1E2935;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--desk);color:var(--ink);font:400 16px/1.5 "IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:480px;margin:0 auto;padding:28px 16px 40px}
h1{font-size:32px;line-height:1.1;font-weight:600;letter-spacing:-.02em;margin:0 0 6px}
.lede{margin:0 0 24px;color:var(--muted)}
.sheet{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px}
.step-h{display:flex;align-items:center;gap:10px;margin:0 0 14px;font-size:17px;font-weight:600}
.n{display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--ink);color:var(--paper);font-size:13px;font-weight:600}
.row{display:flex;gap:10px}
.row>*{flex:1}
button,.btn{font:inherit;font-weight:500;min-height:48px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--wash);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;text-align:center}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);width:100%;font-weight:600}
button:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
input[type=file]{display:none}
.empty{margin:14px 0 0;color:var(--muted);font-size:15px}
.thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.thumb{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--wash)}
.frame{position:relative;aspect-ratio:3/4;background:var(--desk)}
.frame canvas{width:100%;height:100%;object-fit:contain;display:block}
.pg{position:absolute;left:6px;top:6px;background:var(--ink);color:var(--paper);font-size:12px;font-weight:600;border-radius:6px;padding:1px 7px}
.tools{display:flex}
.tools button{flex:1;min-height:40px;padding:0;border:0;border-top:1px solid var(--line);border-radius:0;background:transparent;font-size:18px}
.tools button+button{border-left:1px solid var(--line)}
.sizes{display:grid;gap:8px;border:0;padding:0;margin:0}
.opt{display:flex;gap:12px;align-items:flex-start;padding:12px;border:1px solid var(--line);border-radius:10px;cursor:pointer}
.opt:has(input:checked){border-color:var(--accent);background:var(--wash)}
.opt input{margin-top:4px;accent-color:var(--accent)}
.opt b{display:block;font-weight:600}
.opt span{color:var(--muted);font-size:14px}
label.f{display:block;font-size:14px;color:var(--muted);margin-bottom:6px}
.name{display:flex;align-items:center;border:1px solid var(--line);border-radius:10px;background:var(--wash);padding-right:12px}
.name input{flex:1;min-width:0;font:500 15px "IBM Plex Mono",ui-monospace,Menlo,monospace;color:var(--ink);background:transparent;border:0;padding:13px 4px 13px 12px;outline:none}
.name:focus-within{outline:3px solid var(--accent);outline-offset:2px}
.name em{font:500 15px "IBM Plex Mono",ui-monospace,monospace;color:var(--muted);font-style:normal}
.hint{margin:8px 0 0;font-size:14px;color:var(--muted)}
.done{border-color:var(--ok)}
.done h2{margin:0 0 4px;font-size:17px;color:var(--ok)}
.fname{font:500 15px "IBM Plex Mono",ui-monospace,monospace;word-break:break-all;margin:0 0 6px}
.stat{margin:0 0 14px;color:var(--muted)}
.stat strong{color:var(--ink)}
.msg{min-height:22px;margin:10px 0 0;font-size:14px;color:var(--muted)}
.err{color:#C0392B}
:root[data-theme="dark"] .err{color:#FF8A80}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .err{color:#FF8A80}}
</style>
</head>
<body>
<main>
  <h1>Snap to PDF</h1>
  <p class="lede">Photos of receipts in. One small, named PDF out.</p>

  <section class="sheet" aria-labelledby="h1">
    <h2 class="step-h" id="h1"><span class="n">1</span>Add pages</h2>
    <div class="row">
      <button type="button" id="cam">Take photo</button>
      <button type="button" id="pick">Choose images</button>
    </div>
    <input type="file" id="camIn" accept="image/*" capture="environment">
    <input type="file" id="pickIn" accept="image/*" multiple>
    <p class="empty" id="empty">No pages yet. Take a photo or choose images from your gallery.</p>
    <div class="thumbs" id="thumbs"></div>
  </section>

  <section class="sheet" aria-labelledby="hc">
    <h2 class="step-h" id="hc"><span class="n">2</span>Clean up</h2>
    <fieldset class="sizes">
      <legend style="position:absolute;left:-9999px">Scan look</legend>
      <label class="opt"><input type="radio" name="lk" value="color" checked><div><b>Original</b><span>Keep the photo as taken.</span></div></label>
      <label class="opt"><input type="radio" name="lk" value="clean"><div><b>Clean scan</b><span>Grayscale with brighter paper.</span></div></label>
      <label class="opt"><input type="radio" name="lk" value="bw"><div><b>Black and white</b><span>Crisp text and the smallest file.</span></div></label>
    </fieldset>
    <label class="opt" style="margin-top:8px"><input type="checkbox" id="fix"><div><b>Auto-crop and straighten</b><span>Trims the table around the paper and levels tilted text. Best effort.</span></div></label>
  </section>

  <section class="sheet" aria-labelledby="h2">
    <h2 class="step-h" id="h2"><span class="n">3</span>Pick a size</h2>
    <fieldset class="sizes">
      <legend style="position:absolute;left:-9999px">File size</legend>
      <label class="opt"><input type="radio" name="sz" value="small"><div><b>Email small</b><span>Smallest file. Text stays readable.</span></div></label>
      <label class="opt"><input type="radio" name="sz" value="balanced" checked><div><b>Balanced</b><span>Good for most invoices and receipts.</span></div></label>
      <label class="opt"><input type="radio" name="sz" value="sharp"><div><b>Sharp</b><span>Bigger file. Best for fine print.</span></div></label>
    </fieldset>
  </section>

  <section class="sheet" aria-labelledby="h3">
    <h2 class="step-h" id="h3"><span class="n">4</span>Name it</h2>
    <label class="f" for="nm">File name</label>
    <div class="name"><input id="nm" type="text" autocomplete="off" autocapitalize="off" spellcheck="false"><em>.pdf</em></div>
    <label class="opt" style="margin-top:12px"><input type="checkbox" id="auto" checked><div><b>Name it from the receipt</b><span>Reads the vendor, date, and total from the first and last page on your device. You can still edit the name.</span></div></label>
  </section>

  <button class="primary" id="make" type="button" disabled>Make PDF</button>
  <p class="msg" id="msg" role="status" aria-live="polite"></p>

  <section class="sheet done" id="out" hidden>
    <h2>PDF ready</h2>
    <p class="fname" id="oname"></p>
    <p class="stat" id="ostat"></p>
    <div class="row">
      <button type="button" id="save" hidden>Save PDF</button>
      <button type="button" id="share" hidden>Share</button>
    </div>
    <p class="hint" id="nosave" hidden>Saving isn’t available in this view. Open the page in your browser to save the file.</p>
  </section>
</main>

<script>
(function(){
  var $=function(s){return document.querySelector(s)};
  var presets={small:{max:1000,q:.6},balanced:{max:1600,q:.75},sharp:{max:2200,q:.88}};
  var pages=[],result=null,dl=null,busy=false;

  function pad(n){return String(n).padStart(2,'0')}
  function today(){var d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
  function fmt(n){return n<1048576?Math.max(1,Math.round(n/1024))+' KB':(n/1048576).toFixed(2)+' MB'}
  function safeName(){
    var v=$('#nm').value.trim().replace(/\.pdf$/i,'').replace(/[^\w.\- ]+/g,'').replace(/\s+/g,'_');
    return (v||today()+'_receipt')+'.pdf';
  }
  function size(){return document.querySelector('input[name=sz]:checked').value}

  $('#nm').value=today()+'_receipt';

  try{
    var p=window.claude&&window.claude.use&&window.claude.use('downloads');
    if(p&&p.then)p.then(function(d){dl=d;showOut()}).catch(function(){});
    else dl={save:function(o){var u=URL.createObjectURL(o.data),a=document.createElement('a');a.href=u;a.download=o.filename;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(u)},5000);return Promise.resolve()}};
  }catch(e){}

  function addFiles(list){
    Array.prototype.forEach.call(list,function(f){
      if(f.type&&f.type.indexOf('image/')===0){
        var pg={file:f,url:URL.createObjectURL(f),rot:0,img:new Image()};
        pg.img.onload=function(){paint(pg)};pg.img.src=pg.url;pages.push(pg);
      }
    });
    result=null;render();
  }

  function paint(pg){
    var im=pg.img,cv=pg.cv;if(!cv||!im.naturalWidth)return;
    var o=pg.rot%2,w=o?im.naturalHeight:im.naturalWidth,h=o?im.naturalWidth:im.naturalHeight,s=Math.min(1,260/Math.max(w,h));
    cv.width=Math.round(w*s);cv.height=Math.round(h*s);
    var x=cv.getContext('2d'),iw=im.naturalWidth*s,ih=im.naturalHeight*s;
    x.translate(cv.width/2,cv.height/2);x.rotate(pg.rot*Math.PI/2);x.drawImage(im,-iw/2,-ih/2,iw,ih);
  }

  function render(){
    var t=$('#thumbs');t.textContent='';
    pages.forEach(function(pg,i){
      var d=document.createElement('div');d.className='thumb';
      var fr=document.createElement('div');fr.className='frame';
      pg.cv=document.createElement('canvas');pg.cv.setAttribute('role','img');pg.cv.setAttribute('aria-label','Page '+(i+1));
      var tag=document.createElement('span');tag.className='pg';tag.textContent=String(i+1);
      fr.appendChild(pg.cv);fr.appendChild(tag);
      var tl=document.createElement('div');tl.className='tools';
      var tb=function(txt,label,fn){var b=document.createElement('button');b.type='button';b.textContent=txt;b.setAttribute('aria-label',label+' page '+(i+1));b.onclick=function(){fn();result=null;render()};tl.appendChild(b)};
      if(i>0)tb('‹','Move earlier',function(){pages.splice(i-1,0,pages.splice(i,1)[0])});
      tb('↻','Rotate',function(){pg.rot=(pg.rot+1)%4});
      if(i<pages.length-1)tb('›','Move later',function(){pages.splice(i+1,0,pages.splice(i,1)[0])});
      tb('×','Remove',function(){URL.revokeObjectURL(pg.url);pages.splice(i,1)});
      d.appendChild(fr);d.appendChild(tl);t.appendChild(d);paint(pg);
    });
    $('#empty').hidden=pages.length>0;
    var b=$('#make');b.disabled=!pages.length||busy;
    b.textContent=pages.length?'Make PDF ('+pages.length+(pages.length===1?' page)':' pages)'):'Make PDF';
    $('#out').hidden=!result;
    if(result)showOut();
  }

  function showOut(){
    if(!result)return;
    $('#oname').textContent=result.name;
    var pct=Math.max(0,Math.round((1-result.blob.size/result.orig)*100));
    $('#ostat').innerHTML='';
    var s=document.createElement('span');
    s.appendChild(document.createTextNode('Now '));
    var a=document.createElement('strong');a.textContent=fmt(result.blob.size);s.appendChild(a);
    s.appendChild(document.createTextNode(', down from '+fmt(result.orig)+' ('+pct+'% smaller).'));
    $('#ostat').appendChild(s);
    var canShare=false;
    try{canShare=!!(navigator.canShare&&navigator.canShare({files:[new File([result.blob],result.name,{type:'application/pdf'})]}))}catch(e){}
    $('#save').hidden=!dl;
    $('#share').hidden=!canShare;
    $('#nosave').hidden=!!dl||canShare;
  }

  function say(t,err){var m=$('#msg');m.textContent=t||'';m.className='msg'+(err?' err':'')}

  function tick(){return new Promise(function(r){setTimeout(r,0)})}
  function lum(d,n){var g=new Uint8Array(n),h=new Array(256).fill(0),i,v;for(i=0;i<n;i++){v=(d[i*4]*77+d[i*4+1]*150+d[i*4+2]*29)>>8;g[i]=v;h[v]++}return{g:g,h:h}}
  function otsu(h,t){var sum=0,i,sb=0,wb=0,best=0,th=127;for(i=0;i<256;i++)sum+=i*h[i];for(i=0;i<256;i++){wb+=h[i];if(!wb)continue;var wf=t-wb;if(!wf)break;sb+=i*h[i];var m=sb/wb-(sum-sb)/wf,v=wb*wf*m*m;if(v>best){best=v;th=i}}return th}
  function small(c,m){var s=Math.min(1,m/Math.max(c.width,c.height)),w=Math.max(1,Math.round(c.width*s)),h=Math.max(1,Math.round(c.height*s)),t=document.createElement('canvas');t.width=w;t.height=h;var x=t.getContext('2d');x.drawImage(c,0,0,w,h);return{w:w,h:h,s:s,d:x.getImageData(0,0,w,h).data}}
  function rotated(b,rot,max){
    var s=Math.min(1,max/Math.max(b.width,b.height)),w=Math.round(b.width*s),h=Math.round(b.height*s),o=rot%2;
    var c=document.createElement('canvas');c.width=o?h:w;c.height=o?w:h;
    var x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);
    x.translate(c.width/2,c.height/2);x.rotate(rot*Math.PI/2);x.drawImage(b,-w/2,-h/2,w,h);return c;
  }
  function fixPage(c){
    var q=small(c,300),w=q.w,h=q.h,L=lum(q.d,w*h),th=otsu(L.h,w*h),rows=new Array(h).fill(0),cols=new Array(w).fill(0),n=0,i;
    for(i=0;i<w*h;i++)if(L.g[i]>th){rows[(i/w)|0]++;cols[i%w]++;n++}
    if(n<w*h*.15||n>w*h*.97)return deskew(c);
    var rm=Math.max.apply(null,rows)*.25,cm=Math.max.apply(null,cols)*.25,y0=0,y1=h-1,x0=0,x1=w-1;
    while(y0<h&&rows[y0]<rm)y0++;while(y1>y0&&rows[y1]<rm)y1--;while(x0<w&&cols[x0]<cm)x0++;while(x1>x0&&cols[x1]<cm)x1--;
    var px=Math.round(w*.02),py=Math.round(h*.02);x0=Math.max(0,x0-px);x1=Math.min(w-1,x1+px);y0=Math.max(0,y0-py);y1=Math.min(h-1,y1+py);
    var ar=(x1-x0)*(y1-y0);if(ar>w*h*.95||ar<w*h*.2)return deskew(c);
    var k=1/q.s,o=document.createElement('canvas');o.width=Math.round((x1-x0)*k);o.height=Math.round((y1-y0)*k);
    o.getContext('2d').drawImage(c,x0*k,y0*k,o.width,o.height,0,0,o.width,o.height);
    return deskew(o);
  }
  function deskew(c){
    var W=c.width,H=c.height,q=small(c,400),w=q.w,h=q.h,L=lum(q.d,w*h),th=otsu(L.h,w*h)*.85,pts=[],i,j,a;
    for(i=0;i<w*h;i++)if(L.g[i]<th)pts.push(i%w,(i/w)|0);
    if(pts.length<400)return c;
    var best=0,bs=-1;
    for(a=-6;a<=6;a+=.5){
      var r=a*Math.PI/180,sn=Math.sin(r),cs=Math.cos(r),bins=new Array(h*2).fill(0);
      for(j=0;j<pts.length;j+=2){var yy=(Math.round(pts[j+1]*cs-pts[j]*sn)+h/2)|0;if(yy>=0&&yy<h*2)bins[yy]++}
      var sc=0;for(j=0;j<bins.length;j++)sc+=bins[j]*bins[j];
      if(sc>bs){bs=sc;best=a}
    }
    if(Math.abs(best)<.4)return c;
    var o=document.createElement('canvas');o.width=W;o.height=H;var ox=o.getContext('2d');
    ox.fillStyle='#fff';ox.fillRect(0,0,W,H);ox.translate(W/2,H/2);ox.rotate(-best*Math.PI/180);ox.drawImage(c,-W/2,-H/2);return o;
  }
  function looks(c,mode){
    var w=c.width,h=c.height,x=c.getContext('2d'),im=x.getImageData(0,0,w,h),d=im.data,n=w*h,L=lum(d,n),g=L.g,i,v;
    if(mode==='clean'){
      var lo=0,hi=255,a=0;while(lo<254&&(a+=L.h[lo])<n*.02)lo++;a=0;while(hi>lo+1&&(a+=L.h[hi])<n*.02)hi--;
      var k=255/Math.max(1,hi-lo);
      for(i=0;i<n;i++){v=Math.max(0,Math.min(255,(g[i]-lo)*k));d[i*4]=d[i*4+1]=d[i*4+2]=v}
    }else{
      var bw=Math.max(15,w>>4),I=new Uint32Array((w+1)*(h+1)),yy,xx,row;
      for(yy=0;yy<h;yy++){row=0;for(xx=0;xx<w;xx++){row+=g[yy*w+xx];I[(yy+1)*(w+1)+xx+1]=I[yy*(w+1)+xx+1]+row}}
      for(yy=0;yy<h;yy++)for(xx=0;xx<w;xx++){
        var x0=Math.max(0,xx-bw),x1=Math.min(w,xx+bw+1),y0=Math.max(0,yy-bw),y1=Math.min(h,yy+bw+1);
        var s=I[y1*(w+1)+x1]-I[y0*(w+1)+x1]-I[y1*(w+1)+x0]+I[y0*(w+1)+x0],m=s/((x1-x0)*(y1-y0));
        v=g[yy*w+xx]<m*.9?0:255;i=(yy*w+xx)*4;d[i]=d[i+1]=d[i+2]=v;
      }
    }
    x.putImageData(im,0,0);
  }

  var ocrNote='',nmDirty=false;
  $('#nm').addEventListener('input',function(){nmDirty=true});

  function parseReceipt(text){
    var lines=text.split(/\r?\n/).map(function(s){return s.replace(/\s+/g,' ').trim()}).filter(Boolean);
    var mon={jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,oct:10,nov:11,dec:12},date=null,m,i,p;
    function iso(y,mo,d){y=+y;if(y<100)y+=2000;mo=+mo;d=+d;if(y<2000||y>2100||mo<1||mo>12||d<1||d>31)return null;return y+'-'+pad(mo)+'-'+pad(d)}
    if((m=text.match(/\b(20\d{2})[-\/.](\d{1,2})[-\/.](\d{1,2})\b/)))date=iso(m[1],m[2],m[3]);
    if(!date&&(m=text.match(/\b(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{4}|\d{2})\b/)))date=(+m[1]>12)?iso(m[3],m[2],m[1]):iso(m[3],m[1],m[2]);
    if(!date&&(m=text.match(/\b(\d{1,2})\s*(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*\.?,?\s*(\d{4})\b/i)))date=iso(m[3],mon[m[2].toLowerCase()],m[1]);
    if(!date&&(m=text.match(/\b(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*\.?\s*(\d{1,2}),?\s*(\d{4})\b/i)))date=iso(m[3],mon[m[1].toLowerCase()],m[2]);
    function num(s){s=s.replace(/[^\d.,]/g,'');if(!s)return null;var lc=s.lastIndexOf(','),ld=s.lastIndexOf('.');
      if(lc>-1&&ld>-1)s=lc>ld?s.replace(/\./g,'').replace(',','.'):s.replace(/,/g,'');
      else if(lc>-1)s=/,\d{2}$/.test(s)?s.replace(',','.'):s.replace(/,/g,'');
      var v=parseFloat(s);return isFinite(v)&&v>0?v:null}
    var pri=[/grand\s*total|amount\s*due|total\s*due|balance\s*due/i,/total\s*amount|amount\s*payable|net\s*total/i,/\btotal\b/i],total=null;
    for(p=0;p<pri.length&&total===null;p++)for(i=lines.length-1;i>=0&&total===null;i--){
      if(!pri[p].test(lines[i])||/sub\s*-?\s*total/i.test(lines[i]))continue;
      var own=lines[i].match(/\d[\d.,]*/g)||[],nx=(lines[i+1]||'').match(/\d[\d.,]*/g)||[],pk=own.length?own[own.length-1]:nx[nx.length-1];
      if(pk)total=num(pk);
    }
    if(total===null)(text.match(/\b\d{1,3}(?:[.,]\d{3})*[.,]\d{2}\b/g)||[]).forEach(function(s){var v=num(s);if(v!==null&&(total===null||v>total))total=v});
    var skip=/receipt|invoice|tax|official|cashier|tel\b|phone|www\.|http|@|vat|tin\b|address|street|date|time|order|table|customer|thank/i,vendor=null;
    for(i=0;i<Math.min(lines.length,8)&&!vendor;i++){
      var l=lines[i].replace(/[^A-Za-z0-9&' -]/g,' ').replace(/\s+/g,' ').trim();
      if((l.match(/[A-Za-z]/g)||[]).length<3||skip.test(l)||/^\d/.test(l))continue;
      vendor=l.split(' ').slice(0,3).map(function(w){w=w.replace(/'/g,'').replace(/&/g,'and');return w.charAt(0).toUpperCase()+w.slice(1).toLowerCase()}).join('_').slice(0,28);
    }
    return{date:date,vendor:vendor,total:total===null?null:total.toFixed(2)};
  }

  async function autoName(cs){
    try{
      if(!window.Tesseract)throw new Error('ocr');
      say('Reading the receipt…');
      var wk=await Tesseract.createWorker('eng'),txt='';
      for(var i=0;i<cs.length;i++){var r=await wk.recognize(cs[i]);txt+='\n'+r.data.text}
      await wk.terminate();
      var g=parseReceipt(txt);
      $('#nm').value=(g.vendor||g.total)?[g.date||today(),g.vendor,g.total].filter(Boolean).join('_'):(g.date||today())+'_receipt';
      if(!g.vendor&&!g.total)ocrNote='Could not find a vendor or total, so I used the date.';
    }catch(e){ocrNote='Auto-naming could not run here, so I used the date.'}
  }

  async function build(){
    var PDF=window.PDFLib&&window.PDFLib.PDFDocument;
    if(!PDF)throw new Error('The PDF library did not load. Check your connection and reload.');
    var pr=presets[size()],doc=await PDF.create(),orig=0,keep=[];
    for(var i=0;i<pages.length;i++){
      say('Processing page '+(i+1)+' of '+pages.length+'…');
      var f=pages[i].file;orig+=f.size;
      var bmp;
      try{bmp=await createImageBitmap(f,{imageOrientation:'from-image'})}catch(e){bmp=await createImageBitmap(f)}
      var c=rotated(bmp,pages[i].rot,pr.max);
      if(bmp.close)bmp.close();
      if($('#fix').checked){await tick();c=fixPage(c)}
      var lk=document.querySelector('input[name=lk]:checked').value;
      if(lk!=='color'){await tick();looks(c,lk)}
      var w=c.width,h=c.height;
      if(i===0||i===pages.length-1)keep.push(c);
      var blob=await new Promise(function(r){c.toBlob(r,'image/jpeg',pr.q)});
      var img=await doc.embedJpg(await blob.arrayBuffer());
      var pw=595,ph=Math.round(595*h/w);
      doc.addPage([pw,ph]).drawImage(img,{x:0,y:0,width:pw,height:ph});
    }
    if($('#auto').checked&&!nmDirty)await autoName(keep);
    var bytes=await doc.save();
    return {blob:new Blob([bytes],{type:'application/pdf'}),orig:orig,name:safeName()};
  }

  $('#make').onclick=async function(){
    if(busy||!pages.length)return;
    busy=true;result=null;render();say('Starting…');
    try{ocrNote='';result=await build();say(ocrNote)}
    catch(e){say(e&&e.message?e.message:'Something went wrong. Try fewer or smaller photos.',true)}
    busy=false;render();
    if(result)$('#out').scrollIntoView({behavior:'smooth',block:'nearest'});
  };

  $('#save').onclick=async function(){
    if(!dl||!result)return;
    result.name=safeName();$('#oname').textContent=result.name;
    try{await dl.save({filename:result.name,data:result.blob});say('Saved '+result.name+'.')}
    catch(e){if(!e||e.code!=='declined')say('Could not save the file. Try Share, or open the page in your browser.',true)}
  };
  $('#share').onclick=async function(){
    if(!result)return;
    result.name=safeName();$('#oname').textContent=result.name;
    try{await navigator.share({files:[new File([result.blob],result.name,{type:'application/pdf'})],title:result.name})}
    catch(e){if(!e||e.name!=='AbortError')say('Sharing failed on this device.',true)}
  };

  $('#cam').onclick=function(){$('#camIn').click()};
  $('#pick').onclick=function(){$('#pickIn').click()};
  $('#camIn').onchange=function(e){addFiles(e.target.files);e.target.value=''};
  $('#pickIn').onchange=function(e){addFiles(e.target.files);e.target.value=''};

  render();
})();
</script>
</body>
